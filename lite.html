<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Intergalactic Colosseum</title>
<meta name="description" content="Step into the Intergalactic Colosseum: a 3D arena in space, presented by Maximus Law.">
<meta property="og:title" content="Intergalactic Colosseum">
<meta property="og:image" content="/preview.jpg">
<meta name="theme-color" content="#05061a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#05061a;color:#efe8ff;font-family:Inter,system-ui,sans-serif;overflow:hidden}
  #bg{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;background:#05061a url(lite-poster.jpg) center/cover no-repeat}
  #shade{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 60% 50%,transparent 45%,rgba(3,3,14,.55))}
  .liteNote{padding:0 14px 12px;font-size:13px;line-height:1.4;color:#cfc8f2;text-align:center}
  .liteNote a{color:#ffe2a0}
  /* v1.0.44 casual: glass events panel (left) replaces title, dock and drawer */
  .hud h1{display:none}
  #events{display:none}
  body.casual .dock,body.casual #drawer{display:none!important}
  body.casual #events{position:fixed;left:20px;top:20px;width:380px;max-height:calc(100vh - 40px);z-index:4;display:flex;flex-direction:column;
    background:linear-gradient(160deg,rgba(255,236,190,.10),rgba(40,30,90,.18) 40%,rgba(10,8,30,.30));
    border:1px solid rgba(226,176,79,.55);border-radius:20px;overflow:hidden;
    backdrop-filter:blur(12px) saturate(1.25);-webkit-backdrop-filter:blur(12px) saturate(1.25);
    box-shadow:0 18px 50px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,240,200,.35),inset 0 0 0 1px rgba(255,255,255,.04)}
  body.clean #events{display:none!important}
  .evHead{padding:18px 20px 12px;text-align:center;border-bottom:1px solid rgba(226,176,79,.3)}
  .evHead h2{margin:0;font-family:Cinzel,serif;font-weight:700;font-size:22px;letter-spacing:.1em;line-height:1.25;
    background:linear-gradient(90deg,#ffe2a0,#e2b04f 45%,#fff3cf);-webkit-background-clip:text;background-clip:text;color:transparent}
  .evHead h2 .x{color:#cfc8f2;-webkit-text-fill-color:#cfc8f2;font-size:18px;margin:0 6px}
  .evHead p{margin:4px 0 0;font-size:13px;letter-spacing:.22em;color:#9fb6ff;text-transform:uppercase}
  .evBody{flex:0 1 auto;min-height:0;overflow:auto;padding:12px 14px}
  .evBody > section{display:none}.evBody > section.on{display:block}
  .ev{display:flex;align-items:center;gap:12px;padding:10px 10px;margin-bottom:8px;border-radius:14px;
    background:rgba(14,12,38,.35);border:1px solid rgba(255,255,255,.08)}
  .ev.next{border-color:rgba(255,210,122,.6);background:rgba(60,44,20,.32)}
  .ev .d{flex:none;width:52px;text-align:center;line-height:1.05;font-family:Cinzel,serif;color:#ffe2a0}
  .ev .d small{display:block;font:600 12px Inter,sans-serif;letter-spacing:.12em;color:#9fb6ff}
  .ev .d b{display:block;font-size:24px}
  .ev .t{flex:1;min-width:0}
  .ev .t b{display:block;font-size:15px;font-weight:600;color:#fff6dd;line-height:1.3}
  .ev .t span{display:block;font-size:13px;color:#e2b04f;margin-top:2px}
  .ev a{flex:none;font:700 13px Inter,sans-serif;letter-spacing:.04em;color:#1a1230;text-decoration:none;padding:8px 12px;border-radius:999px;
    background:linear-gradient(180deg,#ffe2a0,#d9a441);box-shadow:0 2px 10px rgba(226,176,79,.25)}
  .ev a:hover{filter:brightness(1.1)}
  .ev.past{opacity:.5}.ev.past a{display:none}
  .ev .tag{flex:none;font-size:12px;color:#cfc8f2}
  .evBack{font:600 14px Inter,sans-serif;color:#cfc8f2;background:none;border:none;cursor:pointer;padding:2px 0 10px}
  .evBody .grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .evBody .grid button{font:600 14px Inter,sans-serif;color:#efe8ff;background:rgba(14,12,38,.45);border:1px solid rgba(226,176,79,.4);padding:9px 10px;border-radius:10px;cursor:pointer}
  .evBody .grid button:hover{border-color:#ffd27a}
  .evBody .tourOpt{font:600 14px Inter,sans-serif;color:#efe8ff;background:rgba(14,12,38,.45)!important;border:1px solid rgba(226,176,79,.4);cursor:pointer}
  .evBody .info{font-size:14px;line-height:1.45;color:#cfc8f2;margin:0 0 10px}
  .evBody [data-pane=camera] h4,.evBody [data-pane=camera] .row{display:none}
  .evDock{display:flex;gap:6px;padding:10px 12px 12px;border-top:1px solid rgba(226,176,79,.3);background:rgba(10,8,30,.25)}
  .evDock button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;font:600 14px Inter,sans-serif;color:#efe8ff;
    background:rgba(14,12,38,.4);border:1px solid rgba(226,176,79,.35);padding:10px 8px;border-radius:12px;cursor:pointer}
  .evDock button:hover{border-color:#ffd27a}
  #eSched{display:none}
  .ico{width:20px;height:20px;flex:none;filter:drop-shadow(0 0 3px rgba(226,176,79,.35))}
  .tourOpt em .ico{width:34px;height:34px;display:block;margin:auto}

  .evDock button.on{background:rgba(226,176,79,.28);border-color:rgba(255,226,160,.8);color:#fff6dd}
  @media (max-width:640px){
    body.casual #events{left:8px;right:8px;top:auto;bottom:8px;width:auto;max-height:60vh}
    #events:not(.open) .evHead,#events:not(.open) .evBody{display:none}
    #events:not(.open) .evDock{border-top:none}
    #eSched{display:flex}
    .evDock{gap:4px;padding:6px}
    .evDock button{flex-direction:column;gap:3px;font-size:12px;padding:7px 2px}
    .evDock .ico{width:22px;height:22px}
    .evHead{padding:10px 14px 8px}.evHead h2{font-size:18px}.evHead p{display:none}
    .evBody{padding:8px 10px}.ev{padding:8px;gap:10px;margin-bottom:6px}.ev .d{width:44px}.ev .d b{font-size:20px}
    body.casual #toast{top:10px}
  }
  @media (max-width:640px){#events:not(.open) .liteNote{display:none}}
</style>
</head>
<body class="casual lite">
<video id="bg" autoplay muted loop playsinline preload="auto" poster="lite-poster.jpg">
  <source src="lite-tour.mp4" type="video/mp4">
</video>
<div id="shade"></div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><linearGradient id="goldG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff3cf"/><stop offset=".5" stop-color="#e2b04f"/><stop offset="1" stop-color="#9a6a24"/></linearGradient></defs></svg>
<aside id="events" aria-label="Versus x Maximus Games">
  <div class="evHead"><h2>Versus<span class="x">×</span>Maximus Games</h2><p>Season schedule</p></div>
  <div class="evBody">
    <section data-ev="list" class="on"><div id="evList"></div></section>
  </div>
  <p class="liteNote">You're watching the tour video, made for lighter devices.</p>
  <div class="evDock">
    <button id="eReplay" data-ico="play">Replay</button>
    <button id="eSched" data-ico="calendar">Schedule</button>
    <button id="eLive" data-ico="galaxy">Live 3D</button>
  </div>
</aside>

function icon(n) { return ICONS[n] ? `<svg class="ico" viewBox="0 0 240 240" aria-hidden="true"><path fill="url(#goldG)" fill-rule="evenodd" d="${ICONS[n]}"/></svg>` : ''; }
// Shared by the live 3D page and the lite page (injected at build time).
// versusroyale.com owns the schedule. Until its public feed is live (and allows this site),
// the built-in list below is shown. Edit FALLBACK_EVENTS to change the backup list.
const EVENTS_FEED = 'https://versusroyale.com/api/public/maximus-events';
const SIGNUP_BASE = 'https://versusroyale.com';
const FALLBACK_EVENTS = [
  { date: '2026-11-22', name: 'Super Mario 64 Royale', url: 'https://versusroyale.com' },
  { date: '2026-11-29', name: 'Super Smash Bros Ultimate Tournament', url: 'https://versusroyale.com' },
  { date: '2026-12-05', name: 'Mario Kart 8 Deluxe Tournament', url: 'https://versusroyale.com' },
  { date: '2026-12-13', name: 'Super Mario Galaxy Royale', url: 'https://versusroyale.com' },
  { date: '2026-12-19', name: 'Versus Gauntlet', sub: 'Sponsored by Maximus', url: 'https://versusroyale.com' },
];
// Turn whatever the feed sends into { date: 'YYYY-MM-DD', name, sub?, url }. Unknown shapes are skipped.
function normalizeFeed(data) {
  const list = Array.isArray(data) ? data : (data && (data.events || data.items || data.data)) || [];
  const pad = n => String(n).padStart(2, '0');
  return list.map(e => {
    const when = e.date || e.startDate || e.startsAt || e.startTime || e.start || e.scheduledAt;
    const d = when ? new Date(when) : null;
    const name = e.name || e.title || e.eventName;
    if (!d || isNaN(d) || !name) return null;
    const date = /^\d{4}-\d{2}-\d{2}$/.test(String(when)) ? String(when) : `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
    const url = e.signupUrl || e.signUpUrl || e.url || e.link || (e.slug ? `${SIGNUP_BASE}/events/${e.slug}` : SIGNUP_BASE);
    return { date, name, sub: e.sponsor ? `Sponsored by ${e.sponsor}` : (e.subtitle || e.tagline || undefined), url };
  }).filter(Boolean).sort((a, b) => a.date.localeCompare(b.date));
}
function renderEvents(evList, events) {
  const DOW = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'], MON = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];
  const today = new Date(); today.setHours(0, 0, 0, 0);
  evList.innerHTML = '';
  let nextMarked = false;
  for (const ev of events) {
    const [y, m, d] = ev.date.split('-').map(Number), dt = new Date(y, m - 1, d);
    const past = dt < today, row = document.createElement('div');
    row.className = 'ev' + (past ? ' past' : '');
    if (!past && !nextMarked) { row.classList.add('next'); nextMarked = true; }
    row.innerHTML = `<div class="d"><small>${DOW[dt.getDay()]}</small><b>${d}</b><small>${MON[m - 1]}</small></div>
      <div class="t"><b></b>${ev.sub ? '<span></span>' : ''}</div>${past ? '<span class="tag">Ended</span>' : ''}<a target="_blank" rel="noopener">Sign up</a>`;
    row.querySelector('.t b').textContent = ev.name;
    if (ev.sub) row.querySelector('.t span').textContent = ev.sub;
    row.querySelector('a').href = /^https:\/\//.test(ev.url) ? ev.url : SIGNUP_BASE;
    evList.appendChild(row);
  }
}
// Shows the backup list right away, then swaps in the live schedule if the feed answers within 4 s.
function loadEvents(evList) {
  renderEvents(evList, FALLBACK_EVENTS);
  if (location.protocol === 'file:') return;
  const ctl = new AbortController(); setTimeout(() => ctl.abort(), 4000);
  fetch(EVENTS_FEED, { signal: ctl.signal, headers: { accept: 'application/json' } })
    .then(r => r.ok ? r.json() : Promise.reject(r.status))
    .then(d => { const ev = normalizeFeed(d); if (ev.length) renderEvents(evList, ev); })
    .catch(() => {});
}

const evEl = document.getElementById('events'), video = document.getElementById('bg');
loadEvents(document.getElementById('evList'));
evEl.querySelectorAll('[data-ico]').forEach(b => b.insertAdjacentHTML('afterbegin', icon(b.dataset.ico)));
const phone = () => matchMedia('(max-width:640px)').matches;
const eSched = document.getElementById('eSched');
const sync = () => eSched.classList.toggle('on', phone() && evEl.classList.contains('open'));
eSched.onclick = () => { evEl.classList.toggle('open'); sync(); };
addEventListener('resize', sync);
document.getElementById('eReplay').onclick = () => { video.currentTime = 0; video.play().catch(() => {}); };
// "Live 3D": go to the real thing and stop sending this visit back here
document.getElementById('eLive').onclick = () => { location.href = './?live=1'; };
// the still picture (poster) stays up if the video can't play
video.addEventListener('error', () => video.removeAttribute('src'), true);
video.play().catch(() => {});
</script>

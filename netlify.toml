[build]
  publish = "."

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/lite.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.mp4"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# full builder mode lives at /tyler (same page; the page switches mode by its path)
[[redirects]]
  from = "/tyler"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/tyler/*"
  to = "/index.html"
  status = 200
